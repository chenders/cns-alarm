[workspace]
resolver = "3"
members = ["crates/cns-engine", "crates/cns-alarm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
cast_precision_loss = "deny"
cast_sign_loss = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
panic = "abort"
strip = true
